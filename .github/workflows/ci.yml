name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint + format (rustfmt, clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      # Pull prebuilt toolchain/deps and push what this run builds. Pushing needs
      # the auth token; forks/PRs without the secret fall back to pull-only.
      - uses: cachix/cachix-action@v17
        with:
          name: cclens
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      # Same pinned tools as local dev (flake devShell) — see flake.nix / justfile.
      - run: nix develop -c just check

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: cachix/cachix-action@v17
        with:
          name: cclens
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - run: nix develop -c just test

  # The enforcing copy of lefthook.yml — hooks can be skipped, this cannot. Leaks
  # are scanned over the whole history (it takes well under a second); identity
  # only over the new commits, because upstream history carries its authors'
  # own addresses. betterleaks is not in nixpkgs, so the release binary is
  # fetched and checked against its published digest. See
  # .claude/rules/session-data-privacy.md.
  privacy:
    name: privacy (betterleaks + commit identity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install betterleaks
        env:
          VERSION: 2.0.0-rc.2
          SHA256: 8f622e1fc93d06c7ecd2250e8d5d1cc323f379b1b0995364f973da476331b918
        run: |
          curl -sSLf -o "$RUNNER_TEMP/betterleaks.tar.gz" \
            "https://github.com/betterleaks/betterleaks/releases/download/v$VERSION/betterleaks_${VERSION}_linux_x64.tar.gz"
          echo "$SHA256  $RUNNER_TEMP/betterleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/betterleaks.tar.gz" -C "$RUNNER_TEMP" betterleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Scan history for leaks
        run: >-
          betterleaks git --log-opts=HEAD --include=commit-messages
          --config .betterleaks.toml --redact --no-banner
      - name: Check commit identity
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # shortcut: the pushed branch is already a remote ref after checkout, so a
          # first push of a new branch checks nothing here; pre-push covers it.
          if [ "$BASE" = 0000000000000000000000000000000000000000 ]; then
            scripts/check-identity.sh "$HEAD" --not --remotes
          else
            scripts/check-identity.sh "$BASE..$HEAD"
          fi

  # One job per system the flake advertises, because the cache only helps the
  # systems it actually holds: a build pushed from Linux does nothing for a mac
  # user, who would compile from source — the exact thing the substituter in
  # flake.nix exists to prevent. x86_64-darwin is the gap, and it stays one until
  # this needs an Intel macOS runner badly enough to pay for the wait.
  build:
    name: nix build + cachix push (${{ matrix.system }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { system: x86_64-linux, os: ubuntu-latest }
          - { system: aarch64-linux, os: ubuntu-24.04-arm }
          - { system: aarch64-darwin, os: macos-latest }
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: cachix/cachix-action@v17
        with:
          name: cclens
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      # Realize the package (and its cargo deps) in the Nix store so cachix-action
      # pushes them. Without this only the devShell is cached and
      # `nix run github:lambdalisue/cclens` still compiles from source.
      # `nix build` resolves the system from the runner, so the matrix needs no
      # flag — the `system` column only names the job.
      - run: nix build .#default

  # The same matrix the release publishes, so a target that stops compiling
  # fails here rather than at the moment a release is cut. Archives are uploaded
  # as run artifacts, which also makes a PR build downloadable for a quick check.
  targets:
    name: cross-platform build
    uses: ./.github/workflows/build.yml
    with:
      tag: dev

  # Whether the crate is still publishable, checked here for the same reason the
  # matrix above is: manifest metadata that crates.io rejects would otherwise
  # surface only once a release is published, and a crates.io version cannot be
  # replaced. The dry run needs no credentials — it packages the crate, builds
  # what it packaged, and stops before the upload. The version it packages is the
  # committed placeholder, which is all this check needs — the release workflow
  # supplies the real one.
  package:
    name: cargo publish --dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo publish --dry-run --locked
