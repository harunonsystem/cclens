name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint + format (rustfmt, clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      # Pull prebuilt toolchain/deps and push what this run builds. Pushing needs
      # the auth token; forks/PRs without the secret fall back to pull-only.
      - uses: cachix/cachix-action@v17
        with:
          name: cclens
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      # Same pinned tools as local dev (flake devShell) — see flake.nix / justfile.
      - run: nix develop -c just check

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: cachix/cachix-action@v17
        with:
          name: cclens
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - run: nix develop -c just test

  # The enforcing copy of lefthook.yml — hooks can be skipped, this cannot. Leaks
  # are scanned over all of the fork's own history (well under a second);
  # identity only over the new commits. betterleaks is not in nixpkgs, so the release binary is
  # fetched and checked against its published digest. See
  # .claude/rules/session-data-privacy.md.
  privacy:
    name: privacy (betterleaks + commit identity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install betterleaks
        env:
          VERSION: 2.0.0-rc.2
          SHA256: 8f622e1fc93d06c7ecd2250e8d5d1cc323f379b1b0995364f973da476331b918
        run: |
          curl -sSLf -o "$RUNNER_TEMP/betterleaks.tar.gz" \
            "https://github.com/betterleaks/betterleaks/releases/download/v$VERSION/betterleaks_${VERSION}_linux_x64.tar.gz"
          echo "$SHA256  $RUNNER_TEMP/betterleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/betterleaks.tar.gz" -C "$RUNNER_TEMP" betterleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      # Upstream commits are already public and keep their authors' addresses;
      # both checks skip what this ref reaches.
      - name: Fetch upstream
        run: git fetch --no-tags https://github.com/lambdalisue/cclens main:refs/remotes/upstream/main
      - name: Scan history for leaks
        run: >-
          betterleaks git --log-opts="HEAD ^refs/remotes/upstream/main"
          --include=commit-messages --config .betterleaks.toml --redact --no-banner
      - name: Check commit identity
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # shortcut: the pushed branch is already a remote ref after checkout, so a
          # first push of a new branch checks nothing here; pre-push covers it.
          if [ "$BASE" = 0000000000000000000000000000000000000000 ]; then
            scripts/check-identity.sh "$HEAD" --not --remotes
          else
            scripts/check-identity.sh "$BASE..$HEAD"
          fi

  # Built on each system the flake advertises, because the cache only helps the
  # systems it actually holds: a build pushed from Linux does nothing for a mac
  # user, who would compile from source — the exact thing the substituter in
  # flake.nix exists to prevent. x86_64-darwin is the gap, and it stays one until
  # this needs an Intel macOS runner badly enough to pay for the wait.
  #
  # Built from the archive GitHub serves for the commit rather than from the
  # checkout: only the archive has VERSION filled in, so only its build is the
  # one `nix run github:lambdalisue/cclens` looks up in the cache.
  build:
    uses: lambdalisue/nix-github-release/.github/workflows/build.yml@v0.1.0
    with:
      cachix-cache: cclens
    secrets:
      cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

  # The upstream release-matrix and crates.io dry-run jobs are dropped: this
  # fork publishes no binaries or crate (README.local.md).
